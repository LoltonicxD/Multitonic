<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multitonic — espace projets</title>
<style>
:root{color-scheme:dark;--ink:#edf3ea;--muted:#9aa69a;--line:#344239;--moss:#c7ed70;--night:#111713;--panel:#1a221c;--cream:#ebe6d9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 83% 7%,#334431 0,transparent 36%),radial-gradient(ellipse at 7% 88%,#2b3830 0,transparent 34%),var(--night);color:var(--ink);font-family:Georgia,'Times New Roman',serif}body:before{content:"";pointer-events:none;position:fixed;inset:0;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.94' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}main{max-width:1170px;margin:0 auto;padding:36px 54px 58px;position:relative}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #465248;padding:0 0 19px;font:11px/1.3 'Courier New',monospace;letter-spacing:.17em;text-transform:uppercase;color:#b7c1b6}.brand{display:flex;align-items:center;gap:11px}.mark{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--moss);border-radius:50%;color:var(--moss);font:18px Georgia}.status{display:flex;gap:9px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--moss);box-shadow:0 0 11px #c7ed70a0}.intro{padding:61px 0 43px;position:relative}.eyebrow{font:11px 'Courier New',monospace;color:var(--moss);letter-spacing:.19em;text-transform:uppercase}.intro h1{font-size:clamp(48px,7vw,82px);font-weight:400;line-height:.95;letter-spacing:-.055em;margin:18px 0 17px;max-width:780px}.intro h1 em{font-weight:400;color:var(--moss)}.intro p{font:15px/1.65 'Courier New',monospace;color:#a8b2a9;max-width:500px;margin:0}.index{position:absolute;right:10px;bottom:35px;color:#77847a;font:12px 'Courier New',monospace;writing-mode:vertical-rl;letter-spacing:.15em}.projects{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{cursor:pointer;text-align:left;position:relative;overflow:hidden;min-height:298px;padding:0;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:inherit;transition:transform .25s,border-color .25s,box-shadow .25s;animation:rise .7s both}.card:nth-child(2){animation-delay:.12s}.card:hover,.card:focus-visible{transform:translateY(-5px);border-color:#a8c978;box-shadow:0 18px 45px #0005;outline:none}.art{height:167px;position:relative;overflow:hidden;background:#26332a}.card:first-child .art{background:linear-gradient(125deg,#34473b,#1c2821 72%)}.card:first-child .art:before{content:"35";position:absolute;right:30px;top:5px;font:italic 136px/.99 Georgia;color:#d4efad;opacity:.88;letter-spacing:-.1em}.card:first-child .art:after{content:"HEURES · SUIVI";position:absolute;left:24px;bottom:22px;color:#c4d0c5;font:10px 'Courier New',monospace;letter-spacing:.22em}.card:nth-child(2) .art{background:linear-gradient(145deg,#35453a,#17221c)}.grid{position:absolute;inset:0;background:linear-gradient(#9cae9420 1px,transparent 1px),linear-gradient(90deg,#9cae9420 1px,transparent 1px);background-size:29px 29px;transform:perspective(280px) rotateX(11deg) scale(1.12);transform-origin:center bottom}.wave{position:absolute;width:460px;height:90px;left:3%;top:39px;border-top:1px solid #c7ed70aa;transform:rotate(-17deg);border-radius:50%;box-shadow:0 -10px 0 -9px #edf3ea66,0 11px 0 -10px #edf3ea66}.wave:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--moss);left:55%;top:-5px;box-shadow:0 0 14px var(--moss)}.art-label{position:absolute;left:24px;top:20px;color:#d6e2d4;font:10px 'Courier New',monospace;letter-spacing:.16em}.body{padding:19px 23px 20px;display:flex;align-items:flex-end;justify-content:space-between}.name{font-size:27px;letter-spacing:-.04em}.desc{color:#aab5ab;font:11px/1.45 'Courier New',monospace;margin-top:5px}.arrow{display:grid;place-items:center;width:35px;height:35px;border:1px solid #637064;border-radius:50%;color:var(--moss);font:20px Georgia;transition:background .2s,color .2s}.card:hover .arrow{background:var(--moss);color:#1a241b}.foot{display:flex;justify-content:space-between;padding-top:23px;margin-top:26px;border-top:1px solid #3b473e;color:#849087;font:10px 'Courier New',monospace;letter-spacing:.09em;text-transform:uppercase}.foot span:last-child{color:#b1bba9}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:680px){main{padding:25px 22px 36px}.intro{padding:48px 0 33px}.intro h1{font-size:57px}.index{display:none}.projects{grid-template-columns:1fr}.card{min-height:270px}.art{height:145px}.foot{gap:16px;flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><header class="top"><div class="brand"><span class="mark">M</span><span>Multitonic&nbsp; / &nbsp;Projets</span></div><div class="status"><span class="dot"></span><span>Un espace disponible</span></div></header><section class="intro"><div class="eyebrow">Votre espace de travail · 2026</div><h1>Les outils,<br><em>à portée de main.</em></h1><p>Un lanceur simple pour retrouver TempTaff et reprendre là où vous en étiez.</p><div class="index">COLLECTION 01 — 01</div></section><section class="projects" aria-label="Projets"><button class="card" data-project="temptaff" aria-label="Ouvrir TempTaff"><div class="art"><div class="art-label">01 / TEMPS DE TRAVAIL</div></div><div class="body"><div><div class="name">TempTaff</div><div class="desc">Le suivi de vos heures, au fil des semaines.</div></div><span class="arrow">↗</span></div></button></section><footer class="foot"><span>Conçu pour ouvrir. Pensé pour reprendre.</span><span>Multitonic&nbsp; · &nbsp;Espace local</span></footer></main><script>document.querySelectorAll('[data-project]').forEach(card=>card.addEventListener('click',()=>window.multitonic.openProject(card.dataset.project)));</script></body></html>
